# =====================================================================
# メッセージ（基本設計「07_メッセージ一覧」第1.2版に対応）
#   キー＝メッセージID。プログラムに文言を直接書かない。
#   入力チェック（Bean Validation）のメッセージも本ファイルに定義する（後半）。
# =====================================================================

# --- 情報（I） ---
I-001={0}を登録しました。
I-002={0}を更新しました。
I-003={0}を取り消しました。
I-004=承認申請しました。
I-005=承認しました。
I-006=差し戻しました。
I-007=請求締め処理が完了しました。（作成件数：{0}件）
I-008=棚卸を確定しました。（差異：{0}品目）
I-009=パスワードを変更しました。
I-010=該当するデータはありません。

# --- 警告（W） ---
W-001=有効在庫数が不足している商品があります。このまま登録しますか？（{0}）
W-002=検索結果が{0}件を超えています。条件を絞り込んでください。
W-003=入荷予定日が発注日より前の日付です。このまま登録しますか？
W-004=希望納期が受注日より前の日付です。このまま登録しますか？

# --- エラー（E）：入力チェック ---
E-001={0}を入力してください。
E-002={0}は{1}文字以内で入力してください。
E-003={0}は{1}以上{2}以下の数値で入力してください。
E-004={0}の形式が正しくありません。
E-005={0}は既に登録されています。
E-006={0}が存在しないか、無効になっています。
E-007={0}は{1}以降の日付を入力してください。
E-008=明細を1行以上入力してください。
E-009=同じ商品が複数の明細に入力されています。（{0}）

# --- エラー（E）：認証・権限 ---
E-010=ログインIDまたはパスワードが正しくありません。
E-011=アカウントがロックされています。システム管理者に連絡してください。
E-012=この操作を行う権限がありません。
E-013=一定時間操作がなかったため、ログアウトしました。再度ログインしてください。
E-014=現在のパスワードが正しくありません。
E-015=パスワードは8文字以上で、英字と数字を両方含めてください。
E-016=ログインIDと同じパスワードは使用できません。
E-017=新しいパスワードと確認用のパスワードが一致しません。

# --- エラー（E）：排他・状態 ---
E-020=他のユーザーが先に更新しました。最新の内容を確認してから、もう一度操作してください。
E-021=現在のステータスでは、この操作はできません。（ステータス：{0}）

# --- エラー（E）：在庫 ---
E-030=現在庫数が不足しています。（商品：{0}、現在庫数：{1}、指定数量：{2}）
E-031=棚卸実施中の倉庫のため、入出庫を登録できません。（倉庫：{0}）
E-032=移動元と移動先に同じ倉庫は指定できません。
E-033=有効在庫数を超える数量は移動できません。（商品：{0}、有効在庫数：{1}）
E-034=この倉庫は既に棚卸を実施中です。
E-035=実棚数が未入力の明細があります。（{0}件）
E-036=差異のある明細は理由を入力してください。（{0}）

# --- エラー（E）：購買・販売・請求 ---
E-040=自分が申請した発注は承認できません。
E-041=差戻しの理由を入力してください。
E-042=入荷数量が発注残数を超えています。（商品：{0}、残数：{1}）
E-043=出荷数量が受注残数を超えています。（商品：{0}、残数：{1}）
E-044=数量を1件以上入力してください。
E-045=請求済みの出荷は取り消せません。先に請求の締め取消を行ってください。（請求番号：{0}）
E-046=残数取消を行った受注の出荷は取り消せません。
E-050=対象となる出荷実績がありません。
E-051=発行済みの請求は取り消せません。
E-052=請求締め処理を実行中です。完了してから操作してください。

# --- エラー（E）：システム ---
E-090=システムエラーが発生しました。システム管理者に連絡してください。（受付番号：{0}）
E-091=指定されたページは存在しません。

# =====================================================================
# 入力チェック（Bean Validation）
#   Spring のエラーコード（アノテーション名）をキーとし、文言は上の E-001～E-004 と同じにする。
#   {0}＝項目名（下の「項目名」で定義）、{1} 以降＝アノテーションの属性（属性名の昇順）。
#   例：@Size(max = 20, min = 4) → {1}=max、{2}=min
# =====================================================================
NotBlank={0}を入力してください。
NotNull={0}を入力してください。
NotEmpty={0}を入力してください。
Size={0}は{1}文字以内で入力してください。
Pattern={0}の形式が正しくありません。
typeMismatch={0}の形式が正しくありません。

# --- 項目名（Form のプロパティ名） ---
loginId=ログインID
password=パスワード
userName=氏名
department=所属
defaultWarehouseId=所属倉庫
roles=権限
currentPassword=現在のパスワード
newPassword=新しいパスワード
confirmPassword=新しいパスワード（確認用）
initialPassword=初期パスワード
operatedFrom=操作日時（開始）
operatedTo=操作日時（終了）

# --- メッセージの埋め込み値 ---
label.user=ユーザー
