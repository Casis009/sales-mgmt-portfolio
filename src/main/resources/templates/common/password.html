<!DOCTYPE html>
<!-- SCR-003 パスワード変更（画面一覧 5.3）。パスワードは画面に再表示しない -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head th:replace="~{fragments/layout :: head('パスワード変更')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: breadcrumb(null, 'パスワード変更')}"></nav>
<main class="content">
  <div th:replace="~{fragments/layout :: messages}"></div>
  <p th:if="${#authentication.principal.passwordChangeRequired}" class="msg msg-warn">
    初期パスワードのため、パスワードを変更してください。
  </p>
  <form th:action="@{/password}" th:object="${form}" method="post" class="form" data-once>
    <input type="hidden" th:name="${T(jp.co.hikari.hanbai.common.web.TransactionTokenManager).PARAM}" th:value="${_txToken}">
    <div class="field">
      <label for="currentPassword">現在のパスワード <span class="req" aria-label="必須">※</span></label>
      <input type="password" id="currentPassword" name="currentPassword" maxlength="64" autocomplete="current-password">
      <p class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
    </div>
    <div class="field">
      <label for="newPassword">新しいパスワード <span class="req" aria-label="必須">※</span></label>
      <input type="password" id="newPassword" name="newPassword" autocomplete="new-password"
             aria-describedby="newPasswordHint">
      <p id="newPasswordHint" class="hint">8文字以上64文字以下で、英字と数字を両方含めてください。</p>
      <p class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
    </div>
    <div class="field">
      <label for="confirmPassword">新しいパスワード（確認用） <span class="req" aria-label="必須">※</span></label>
      <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
      <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">変更</button>
    </div>
  </form>
</main>
</body>
</html>
