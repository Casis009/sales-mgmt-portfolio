# P-04：Testcontainers が GitHub Actions 上で動作することを確認する（未実行の草案）
# リポジトリの .github/workflows/poc.yml にコピーして使用する
name: poc

on:
  workflow_dispatch:
  push:
    paths:
      - "poc/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest には Docker が入っているため、Testcontainers はそのまま動作する想定
      - name: MyBatis + Testcontainers
        run: mvn -B -Dtest=MyBatisPocTest test
