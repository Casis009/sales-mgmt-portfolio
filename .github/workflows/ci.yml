# CI：ビルド・静的解析・テスト（開発標準書 3.3「CI がすべて成功していることをマージの条件とする」）
#   ./mvnw verify の中で次の順に実行する。
#     validate          Checkstyle（コーディング規約）
#     test              単体テスト（*Test）
#     integration-test  結合テスト（*IT、Testcontainers で PostgreSQL 17 を起動）  ← 技術検証 P-04
#     verify            SpotBugs、JaCoCo（カバレッジ）
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ubuntu-latest には Docker が入っているため、Testcontainers は追加設定なしで動作する
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/spotbugsXml.xml
            target/checkstyle-result.xml
          if-no-files-found: ignore
          retention-days: 14

      # 技術検証 P-02 の PDF（CI 環境でも日本語フォントが埋め込まれることを目視で確認できるように）
      - name: Upload verification PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-pdf
          path: target/verification/
          if-no-files-found: ignore
          retention-days: 14
